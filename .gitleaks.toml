# Secret-Check (R27): Standardregeln von gitleaks plus IBANs.
title = "haushalt-spar-app"

[extend]
useDefault = true

[[rules]]
id = "iban"
description = "IBAN (echte Bankdaten gehören nicht ins Repo)"
regex = '''\b[A-Z]{2}[0-9]{2}(?:[ ]?[A-Z0-9]{4}){3,7}(?:[ ]?[A-Z0-9]{1,3})?\b'''
keywords = ["de", "at", "ch", "iban"]

[[rules.allowlists]]
description = "Synthetische Test-IBANs mit Bankleitzahl 00000000"
regexes = ['''^[A-Z]{2}[0-9]{2}[ ]?0000[ ]?0000''']
